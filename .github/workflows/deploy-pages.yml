name: Build and deploy Visual Sensor Studio

# main IS the app (promoted from Version2 on 2026-09-02). The workflow no
# longer copies a preview of another branch alongside it: the bare URL serves
# the camera-first rebuild, and Version 1 rides along as ./legacy.html out of
# the same tree. Version 1's full history is on the version_1_legacy branch.
#
# The github-pages environment rejects deployments from any ref but main
# (measured: a Version2-triggered run failed in the deploy job before its
# first step), so this runs on main's pushes and on demand.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (the app)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install TypeScript
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build TypeScript
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
