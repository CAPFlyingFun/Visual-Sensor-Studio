name: Build and deploy Visual Sensor Studio

# Runs only from main's ref: the github-pages environment rejects deployments
# from any other branch (measured: a Version2-triggered run failed in the
# deploy job before its first step). Version2 pushes refresh the preview by
# DISPATCHING this workflow instead — see trigger-preview.yml on Version2.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # The production site is ALWAYS main, whichever branch triggered the
      # run — a Version2 push must refresh the preview, never replace the app.
      - name: Checkout main (production site)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install TypeScript
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Build TypeScript
        run: npm run build

      # The V2 preview rides along under /v2/ so the experimental branch is
      # reachable on a real phone without replacing the production app. A
      # failing Version2 build fails the whole run and deploys nothing, so it
      # can never take the live site down with it.
      - name: Checkout Version2 (preview)
        uses: actions/checkout@v4
        with:
          ref: Version2
          path: v2preview

      - name: Test and build the V2 preview
        working-directory: v2preview
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build

      - name: Publish the preview under /v2/
        run: |
          rm -rf public/v2
          cp -R v2preview/public public/v2

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
